<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Update Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{--ink:#14251c;--muted:#5d6b63;--line:#dfe6e1;--brand:#0d6b4b;--brand-d:#094d36;--bg:#eef2ef;--err:#b3261e;--accent:#0d6b4b;--tint:#eaf5ef}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding:24px 16px;line-height:1.5}
  .wrap{max-width:460px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
  label.f{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  label.f:first-child{margin-top:0}
  input[type=text],input[type=tel],input[type=date],textarea{width:100%;padding:11px 12px;border:1px solid #c5d0c9;border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:76px}
  input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .two label.f{margin-top:14px}
  .opts{display:grid;gap:8px}
  .opts.c2{grid-template-columns:1fr 1fr}
  .opts.c3{grid-template-columns:1fr 1fr}
  .opts label{margin:0;font-weight:500;font-size:14px;border:1px solid #c5d0c9;border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
  .opts input{accent-color:var(--brand)}
  .opts label:has(input:checked){border-color:var(--brand);background:var(--tint)}
  .err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
  button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 16px;cursor:pointer;width:100%}
  button:focus-visible{outline:3px solid #7fc4a5;outline-offset:2px}
  .primary{background:var(--brand);color:#fff}
  .primary:hover{background:var(--brand-d)}
  .secondary{background:#fff;color:var(--brand);border:1px solid var(--brand);margin-top:10px}
  #result{display:none;margin-top:24px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
  .top p.sub{margin:0}
  .hbtn{width:auto;flex:0 0 auto;background:#fff;color:var(--brand);border:1px solid var(--brand);padding:9px 14px;font-size:14px}
  #history{display:none;margin-bottom:18px}
  .hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .hhead h3{margin:0;font-size:16px}
  .link{background:none;border:0;color:var(--err);width:auto;padding:4px 0;font-size:13px;font-weight:600}
  .hitem{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
  .hitem b{font-size:14px;display:block}
  .hitem small{color:var(--muted);font-size:12.5px}
  .hact{display:flex;gap:6px;flex:0 0 auto}
  .hact button{width:auto;padding:7px 12px;font-size:13px}
  .hact .del{background:#fff;color:var(--err);border:1px solid #e3b5b1}
  .empty{color:var(--muted);font-size:14px;padding:6px 0}
  .note{background:#eaf5ef;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px;display:none}

  /* Receipt (exported as JPG) */
  #receipt{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .r-head{background:var(--accent);color:#fff;padding:24px;text-align:center}
  .badge{width:56px;height:56px;border-radius:50%;background:#fff;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
  .badge svg{stroke:var(--accent)}
  .r-head h2{margin:0;font-size:22px}
  .r-head p{margin:4px 0 0;opacity:.92;font-size:14px}
  .track{display:flex;padding:18px 14px 6px}
  .step{flex:1;text-align:center;position:relative;font-size:10.5px;color:#8a978f;line-height:1.25;padding:0 2px}
  .step i{display:block;width:16px;height:16px;border-radius:50%;background:#d5ddd8;margin:0 auto 6px;position:relative;z-index:1}
  .step::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:#d5ddd8}
  .step:first-child::before{display:none}
  .step.done i,.step.done::before,.step.now::before{background:var(--accent)}
  .step.done i{background:var(--accent)}
  .step.now i{background:#fff;border:4px solid var(--accent)}
  .step.done,.step.now{color:var(--ink);font-weight:600}
  .r-body{padding:10px 24px 8px}
  .row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:0}
  .row span:first-child{color:var(--muted);flex:0 0 auto}
  .row span:last-child{text-align:right;font-weight:600;word-break:break-word}
  .total span:last-child{font-size:17px;color:var(--brand-d)}
  .eta{background:var(--tint);border-radius:10px;padding:14px 16px;margin:12px 24px 0;text-align:center;font-size:15px}
  .eta strong{color:var(--brand-d);display:block;font-size:17px}
  .r-foot{padding:14px 24px 20px;text-align:center;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Order update generator</h1>
      <p class="sub">Enter the order once, then pick a status and download the image for each stage.</p>
    </div>
    <button class="hbtn" id="hbtn" aria-expanded="false">History</button>
  </div>

  <div class="panel" id="history">
    <div class="hhead"><h3>Saved orders</h3><button class="link" id="clearAll">Clear all</button></div>
    <div id="hlist"></div>
  </div>

  <div class="panel">
    <div class="note" id="note"></div>
    <div class="two">
      <label class="f" style="margin-top:0">Product name<input type="text" id="product" placeholder="e.g. Trading course"></label>
      <label class="f" style="margin-top:0">Price (₹)<input type="text" id="price" inputmode="decimal" placeholder="e.g. 1499"></label>
    </div>

    <label class="f" for="address">Delivery address</label>
    <textarea id="address" placeholder="House / flat no., street, area, city"></textarea>

    <div class="two">
      <label class="f">PIN code<input type="text" id="pin" inputmode="numeric" maxlength="6" placeholder="6 digits" autocomplete="off"></label>
      <label class="f">Mobile number<input type="tel" id="mobile" inputmode="numeric" maxlength="10" placeholder="10 digits" autocomplete="off"></label>
    </div>

    <div class="two">
      <label class="f">Order ID<input type="text" id="oid"></label>
      <label class="f">Expected delivery<input type="date" id="eta"></label>
    </div>

    <label class="f">Payment method</label>
    <div class="opts c2">
      <label><input type="radio" name="pay" value="Cash on Delivery" checked> Cash on Delivery</label>
      <label><input type="radio" name="pay" value="UPI"> UPI</label>
    </div>

    <label class="f">Order status</label>
    <div class="opts c3" id="statusOpts"></div>

    <div class="err" id="err" role="alert"></div>
    <button class="primary" id="gen">Generate image</button>
  </div>

  <div id="result">
    <div id="receipt">
      <div class="r-head">
        <div class="badge" id="badge"></div>
        <h2 id="s-title"></h2>
        <p id="s-msg"></p>
      </div>
      <div class="track" id="track"></div>
      <div class="r-body">
        <div class="row"><span>Order ID</span><span id="o-id"></span></div>
        <div class="row"><span>Product</span><span id="o-prod"></span></div>
        <div class="row total"><span>Price</span><span id="o-price"></span></div>
        <div class="row"><span>Payment</span><span id="o-pay"></span></div>
        <div class="row"><span>Delivery address</span><span id="o-addr"></span></div>
        <div class="row"><span>PIN code</span><span id="o-pin"></span></div>
        <div class="row"><span>Mobile</span><span id="o-mob"></span></div>
        <div class="row"><span>Updated on</span><span id="o-date"></span></div>
      </div>
      <div class="eta" id="etaBox"></div>
      <div class="r-foot" id="foot"></div>
    </div>
    <button class="primary" id="dl" style="margin-top:14px">Download as JPG</button>
    <button class="secondary" id="reset">New order</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = d => d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const ic = p => `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

const STATUSES = [
  {k:'Order confirmed', short:'Confirmed', color:'#0d6b4b', msg:'Thank you for your order!',
   icon:ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>'), foot:"We'll keep you updated at every step."},
  {k:'Order packed', short:'Packed', color:'#1f6f8b', msg:'Your order is packed and ready to go.',
   icon:ic('<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'), foot:'It will be handed to our shipping partner soon.'},
  {k:'Shipping soon', short:'Shipping', color:'#6a4fb3', msg:'Your order is being prepared for shipping.',
   icon:ic('<rect x="2" y="7" width="12" height="9" rx="1"/><path d="M14 10h4l4 3v3h-8"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>'), foot:'You will get another update once it ships.'},
  {k:'Order shipped', short:'Shipped', color:'#b26a00', msg:'Your order has left our warehouse.',
   icon:ic('<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>'), foot:'It is on its way to you.'},
  {k:'Out for delivery', short:'Out for delivery', color:'#c2410c', msg:'Our delivery partner is on the way to you.',
   icon:ic('<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-7h5l3 7M10 10L8 6H5"/>'), foot:'Please keep your phone handy and be available to receive it.'},
  {k:'Delivered', short:'Delivered', color:'#0d6b4b', msg:'Your order has been delivered. Enjoy!',
   icon:ic('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>'), foot:'Thank you for shopping with us. We hope to serve you again!'}
];

// status radios
$('statusOpts').innerHTML = STATUSES.map((s,i)=>`<label><input type="radio" name="status" value="${i}" ${i===0?'checked':''}> ${s.short}</label>`).join('');

function newOrder(){
  const n = new Date();
  $('oid').value = 'ORD' + String(n.getFullYear()).slice(2) + String(n.getMonth()+1).padStart(2,'0') + String(n.getDate()).padStart(2,'0') + Math.floor(1000+Math.random()*9000);
  const e = new Date(n.getTime()+7*864e5);
  $('eta').value = e.getFullYear()+'-'+String(e.getMonth()+1).padStart(2,'0')+'-'+String(e.getDate()).padStart(2,'0');
}
newOrder();

['pin','mobile'].forEach(i => $(i).addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g,'')));
$('price').addEventListener('input', e => e.target.value = e.target.value.replace(/[^\d.]/g,''));

$('gen').addEventListener('click', () => {
  const product = $('product').value.trim();
  const price = parseFloat($('price').value);
  const address = $('address').value.trim().replace(/\s*\n\s*/g, ', ');
  const pin = $('pin').value.trim(), mobile = $('mobile').value.trim();
  const oid = $('oid').value.trim();
  const pay = document.querySelector('input[name=pay]:checked').value;
  const si = +document.querySelector('input[name=status]:checked').value;
  const err = $('err');

  if (!product) return err.textContent = 'Enter the product name.';
  if (!(price > 0)) return err.textContent = 'Enter a valid price.';
  if (address.length < 10) return err.textContent = 'Enter the full delivery address.';
  if (!/^[1-9]\d{5}$/.test(pin)) return err.textContent = 'Enter a valid 6-digit PIN code.';
  if (!/^[6-9]\d{9}$/.test(mobile)) return err.textContent = 'Enter a valid 10-digit mobile number.';
  if (!oid) return err.textContent = 'Enter an order ID.';
  if (!$('eta').value) return err.textContent = 'Choose the expected delivery date.';
  err.textContent = '';

  const s = STATUSES[si];
  document.documentElement.style.setProperty('--accent', s.color);
  document.documentElement.style.setProperty('--tint', s.color + '18');

  $('badge').innerHTML = s.icon;
  $('s-title').textContent = s.k;
  $('s-msg').textContent = s.msg;
  $('track').innerHTML = STATUSES.map((t,i)=>`<div class="step ${i<si?'done':i===si?'now':''}"><i></i>${t.short}</div>`).join('');

  $('o-id').textContent = oid;
  $('o-prod').textContent = product;
  $('o-price').textContent = '₹' + price.toLocaleString('en-IN',{maximumFractionDigits:2});
  $('o-pay').textContent = pay;
  $('o-addr').textContent = address;
  $('o-pin').textContent = pin;
  $('o-mob').textContent = '+91 ' + mobile.slice(0,5) + ' ' + mobile.slice(5);
  $('o-date').textContent = fmt(new Date());

  const etaDate = fmt(new Date($('eta').value + 'T00:00:00'));
  $('etaBox').innerHTML = si === 5
    ? `Delivered on<strong>${fmt(new Date())}</strong>`
    : si === 4
      ? `Arriving<strong>Today</strong>`
      : `Expected delivery<strong>by ${etaDate}</strong>`;
  $('foot').textContent = s.foot;

  saveEntry({id:oid, status:si, product, price:$('price').value, address:$('address').value.trim(), pin, mobile, pay, eta:$('eta').value, ts:Date.now()});
  $('note').style.display = 'none';

  $('result').style.display = 'block';
  $('result').scrollIntoView({behavior:'smooth', block:'start'});
});

$('dl').addEventListener('click', async () => {
  const btn = $('dl');
  if (typeof html2canvas === 'undefined') { alert('Could not load the image library. Check your internet connection and reload the page.'); return; }
  btn.disabled = true; btn.textContent = 'Preparing image...';
  try {
    const canvas = await html2canvas($('receipt'), {scale:3, backgroundColor:'#ffffff', useCORS:true});
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/jpeg', 0.95);
    a.download = $('oid').value.trim() + '-' + $('s-title').textContent.toLowerCase().replace(/\s+/g,'-') + '.jpg';
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { alert('Could not create the image. Please try again.'); }
  btn.disabled = false; btn.textContent = 'Download as JPG';
});

$('reset').addEventListener('click', () => {
  $('result').style.display = 'none';
  ['product','price','address','pin','mobile'].forEach(i => $(i).value = '');
  document.querySelector('input[name=pay][value="Cash on Delivery"]').checked = true;
  document.querySelector('input[name=status][value="0"]').checked = true;
  newOrder();
  $('note').style.display = 'none';
  window.scrollTo({top:0, behavior:'smooth'});
});

/* ---------- History (localStorage) ---------- */
const KEY = 'orderUpdateHistory';
function loadAll(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
function storeAll(a){ try { localStorage.setItem(KEY, JSON.stringify(a)); } catch(e){ alert('Could not save history in this browser.'); } }
function saveEntry(en){
  const a = loadAll().filter(x => !(x.id === en.id && x.status === en.status));
  a.unshift(en);
  storeAll(a.slice(0,200));
  renderHistory();
}
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderHistory(){
  const a = loadAll();
  $('clearAll').style.display = a.length ? '' : 'none';
  $('hlist').innerHTML = a.length ? a.map((x,i)=>`
    <div class="hitem">
      <div><b>${esc(x.product)} · ₹${esc(x.price)}</b>
      <small>${esc(x.id)} · ${esc(STATUSES[x.status].short)} · ${esc(fmt(new Date(x.ts)))}</small></div>
      <div class="hact"><button class="primary" data-edit="${i}">Edit</button><button class="del" data-del="${i}">Delete</button></div>
    </div>`).join('') : '<div class="empty">No saved orders yet. Orders are saved when you generate an image.</div>';
}
$('hbtn').addEventListener('click', () => {
  const box = $('history'), open = box.style.display !== 'block';
  box.style.display = open ? 'block' : 'none';
  $('hbtn').setAttribute('aria-expanded', open);
  $('hbtn').textContent = open ? 'Close history' : 'History';
  if (open) renderHistory();
});
$('hlist').addEventListener('click', e => {
  const a = loadAll();
  const ed = e.target.dataset.edit, dl = e.target.dataset.del;
  if (ed !== undefined) {
    const x = a[+ed]; if (!x) return;
    $('product').value = x.product; $('price').value = x.price;
    $('address').value = x.address; $('pin').value = x.pin; $('mobile').value = x.mobile;
    $('oid').value = x.id; $('eta').value = x.eta;
    document.querySelector(`input[name=pay][value="${x.pay}"]`).checked = true;
    document.querySelector(`input[name=status][value="${x.status}"]`).checked = true;
    $('result').style.display = 'none';
    $('note').textContent = 'Loaded ' + x.id + '. Change anything you need, pick the status, then generate the image again.';
    $('note').style.display = 'block';
    $('history').style.display = 'none'; $('hbtn').textContent = 'History'; $('hbtn').setAttribute('aria-expanded', false);
    window.scrollTo({top:0, behavior:'smooth'});
  } else if (dl !== undefined) {
    a.splice(+dl,1); storeAll(a); renderHistory();
  }
});
$('clearAll').addEventListener('click', () => {
  if (confirm('Delete all saved orders from this browser?')) { storeAll([]); renderHistory(); }
});
renderHistory();
</script>
</body>
</html>
